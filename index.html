<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Master Portal Login</title><link rel="stylesheet" href="styles.css"></head><body class="login-page"><div class="bg-shape shape1"></div><div class="bg-shape shape2"></div><div class="bg-shape shape3"></div><header class="login-header"><div class="header-left"><img src="National Emblem.png" alt="West Bengal Government" class="govt-logo"></div><h1 class="login-title">Health &amp; Family Welfare — Master Dashboard</h1><div class="header-right"><img src="NHM logo.png" alt="National Health Mission" class="govt-logo"></div></header><main class="login-wrapper"><section class="login-card"><img src="National Emblem.png" alt="Government Logo" class="login-logo"><h2>Administrator Login</h2><p class="login-sub">Secure access to the integrated departmental application portal</p><div class="input-group"><label for="username">Username</label><input id="username" type="text" placeholder="Enter Username" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"></div><div class="input-group"><label for="password">Password</label><div class="password-box"><input id="password" type="password" autocomplete="new-password" placeholder="Enter Password" autocomplete="current-password"><button type="button" class="toggle-password" id="togglePassword">◉</button></div></div><button class="primary-btn" id="loginBtn">🔐 Login to Master Dashboard</button><p class="login-note">Authorized personnel only</p><p class="login-status" id="loginStatus" aria-live="polite"></p></section></main><footer>Health and Family Welfare, Govt. of West Bengal</footer><script src="app.js"></script></body></html>
